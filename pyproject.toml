[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctp-training"
dynamic = ["version"]
description = "Caching Training Protocol: stream training data with a bounded, self-cleaning cache instead of downloading datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "CTP contributors" }]
keywords = ["machine-learning", "llm", "streaming", "dataset", "training", "prefetch", "pytorch", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
    "psutil>=5.9",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
hf = ["datasets>=2.18"]
parquet = ["pyarrow>=14"]
zstd = ["zstandard>=0.22"]
all = ["ctp-training[torch,hf,parquet,zstd]"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-psutil",
    "pyarrow>=14",
    "zstandard>=0.22",
    "build",
]

[project.scripts]
ctp = "ctprotocol.cli:main"

[project.urls]
Documentation = "https://github.com/Riskingfire/ctp-training#readme"
Source = "https://github.com/Riskingfire/ctp-training"
Changelog = "https://github.com/Riskingfire/ctp-training/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "ctprotocol._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctprotocol = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501", "B904"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/ctprotocol"]

[[tool.mypy.overrides]]
module = ["torch.*", "datasets.*", "pyarrow.*", "zstandard.*"]
ignore_missing_imports = true
